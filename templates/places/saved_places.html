{% extends 'base.html' %}{% block title %}Saved places{% endblock %}{% block content %}<div class="container py-5"><h1>Saved places</h1><div class="row g-3 mt-2">{% for p in places %}<div class="col-md-6"><div class="place-body border rounded-4"><h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>{{ p.category.name }} · {{ p.city.name }}</div></div>{% empty %}<p>No saved places yet. <a href="{% url 'place_list' %}">Explore places</a>.</p>{% endfor %}</div></div>{% endblock %}
